apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: apps
  namespace: flux-system
spec:
  # Suspended 2026-11-09 (gen2 -> gen3 migration): the Harbor image scans on gen2 are broken
  # (regcred-flux went away with media) and gen3 will own image automation from Phase 9, so the
  # two clusters must never both push to main. Remove this file at Phase 9.
  suspend: true
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: '{{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}'
    push:
      branch: main
  update:
    path: ./applications
    strategy: Setters
