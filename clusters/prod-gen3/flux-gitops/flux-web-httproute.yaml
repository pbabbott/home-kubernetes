# Gen3's flux-operator is installed by Ansible (no HelmRelease, so no chart-created web route).
# Labelled: gen3 external-dns owns flux.local (target from the Gateway annotation).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
  namespace: flux-system
  labels:
    pihole-dns-enabled: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio-ingress
      namespace: istio-system
      sectionName: https
  hostnames:
    - flux.local.abbottland.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: flux-operator
          port: 9080
