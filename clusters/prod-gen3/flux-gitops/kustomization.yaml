apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No fluxinstance.yaml: gen3's FluxInstance is bootstrapped by Ansible.
resources:
  - ../../../applications/base/flux-gitops
  - flux-web-httproute.yaml

patches:
  - target:
      kind: HelmRelease
      name: flux-operator-mcp
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/values/httpRoute/hostnames/0
        value: flux-mcp.local.abbottland.io
      # flux-operator is Ansible-installed on gen3 (no HelmRelease): drop that dependency.
      - op: remove
        path: /spec/dependsOn/0
      # STAGING ONLY: drops the postRenderer that adds pihole-dns-enabled. The flip commit deletes this op.
      - op: remove
        path: /spec/postRenderers
  - target:
      kind: HTTPRoute
      name: flux-web-http-to-https
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: flux.local.abbottland.io
