apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/cert-manager

patches:
  # Phase 8: cloudflare-ddns (apex A record updater) moved to gen3; only one cluster may run it.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflare-ddns
        namespace: cert-manager
      $patch: delete
