apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/pihole

patches:
  - target:
      kind: HTTPRoute
      name: pihole
      namespace: pihole
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: pihole.local.abbottland.io
  - target:
      kind: HTTPRoute
      name: pihole-http-to-https
      namespace: pihole
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: pihole.local.abbottland.io
  # Phase 6c: pihole.local.abbottland.io moved to gen3. Keep Namespace/Service/EndpointSlice:
  # external-dns on both clusters talks to pihole.pihole.svc:8081.
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: pihole
        namespace: pihole
      $patch: delete
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: pihole-http-to-https
        namespace: pihole
      $patch: delete
