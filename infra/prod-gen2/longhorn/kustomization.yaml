apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/longhorn
  - longhorn-recurring-job.yaml
patches:
  # UI route moved to gen3 (Phase 9): same hostname, so only one cluster may carry it.
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: longhorn-ui
        namespace: longhorn-system
      $patch: delete
  - path: longhorn-helmrelease-patch.yaml
