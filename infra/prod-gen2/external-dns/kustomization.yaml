apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/external-dns

patches:
  - target:
      kind: HelmRelease
      name: external-dns
    patch: |-
      - op: add
        path: /spec/values/txtOwnerId
        value: prod-gen2
      - op: add
        path: /spec/values/domainFilters
        value: ["abbottland.io"]
      # Phase 8: Cloudflare ownership moved to gen3 (same txtOwnerId prod-gen2). Chart 1.15.0 hardcodes replicas: 1,
      # so scale to 0 via a post-renderer. Revert this to roll back. The pihole instance below keeps running.
      - op: add
        path: /spec/postRenderers
        value:
          - kustomize:
              patches:
                - target:
                    kind: Deployment
                    name: external-dns
                  patch: |-
                    - op: replace
                      path: /spec/replicas
                      value: 0
  - target:
      kind: HelmRelease
      name: external-dns-pihole
    patch: |-
      - op: add
        path: /spec/values/txtOwnerId
        value: prod-gen2-pihole
      # upsert-only: gen3's pihole external-dns shares the domain; sync + noop registry would delete its records.
      - op: replace
        path: /spec/values/policy
        value: upsert-only
      - op: replace
        path: /spec/values/domainFilters
        value: ["local.abbottland.io"]
