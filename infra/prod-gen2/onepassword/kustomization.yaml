apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# op-credentials.yaml must be produced with this cluster's sealing key (same flow as non-prod;
# see docs/reference-1password-integration-overview.md). Add it to resources below when ready.
resources:
  - ../../base/onepassword
  - op-credentials.yaml

patches:
  # op-connect route moved to gen3 (Phase 9): same hostname, so only one cluster may carry it.
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: op-connect
        namespace: op-connect
      $patch: delete
