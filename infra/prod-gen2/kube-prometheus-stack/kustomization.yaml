apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/kube-prometheus-stack
  - node-exporter-physical-scrapeconfig.yaml
  - windows-exporter-physical-scrapeconfig.yaml

# Phase 6b: prometheus.local / grafana.local moved to gen3; gen2's UIs keep running under *-gen2 names.
patches:
  - path: kube-prometheus-stack-helm-release-patch.yaml
  - target:
      kind: HTTPRoute
      name: prometheus-ui
      namespace: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: prometheus-gen2.local.abbottland.io
  - target:
      kind: HTTPRoute
      name: grafana-ui
      namespace: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: grafana-gen2.local.abbottland.io

