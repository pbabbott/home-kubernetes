apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace + Service/EndpointSlice proxy to Pi-hole (bananapi) plus the HTTPRoutes for
# pihole.local.abbottland.io (labelled: gen3 owns the record, target from the Gateway annotation).
resources:
  - ../../base/pihole

patches:
  - target:
      kind: HTTPRoute
      name: pihole
      namespace: pihole
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: pihole.local.abbottland.io
  - target:
      kind: HTTPRoute
      name: pihole-http-to-https
      namespace: pihole
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: pihole.local.abbottland.io
