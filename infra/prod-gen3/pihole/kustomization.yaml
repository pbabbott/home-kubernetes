apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Only the namespace + Service/EndpointSlice proxy to Pi-hole (bananapi) that external-dns needs.
# The HTTPRoutes are deleted: pihole.local.abbottland.io is served by gen2 until Phase 6.
resources:
  - ../../base/pihole

patches:
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: pihole
        namespace: pihole
      $patch: delete
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: pihole-http-to-https
        namespace: pihole
      $patch: delete
