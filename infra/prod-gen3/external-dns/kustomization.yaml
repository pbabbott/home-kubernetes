apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pi-hole instance: upsert-only + registry noop so it never deletes gen2's records (same domain).
# Cloudflare instance: dormant (0 replicas + --dry-run) until the public cutover (Phase 8).
# Phase 8 note: gen2 owns its Cloudflare CNAMEs via the txt registry (owner prod-gen2); gen3 must
# use the same owner id (or the records must be recreated) to take them over.
resources:
  - ../../base/external-dns

patches:
  - target:
      kind: HelmRelease
      name: external-dns
    patch: |-
      - op: add
        path: /spec/values/txtOwnerId
        value: prod-gen3
      - op: add
        path: /spec/values/domainFilters
        value: ["abbottland.io"]
      # chart 1.15.0 hardcodes replicas: 1 (no replicaCount value), so scale to 0 via a post-renderer.
      - op: add
        path: /spec/postRenderers
        value:
          - kustomize:
              patches:
                - target:
                    kind: Deployment
                    name: external-dns
                  patch: |-
                    - op: replace
                      path: /spec/replicas
                      value: 0
      - op: add
        path: /spec/values/extraArgs/-
        value: --dry-run
  - target:
      kind: HelmRelease
      name: external-dns-pihole
    patch: |-
      - op: add
        path: /spec/values/txtOwnerId
        value: prod-gen3-pihole
      - op: add
        path: /spec/values/domainFilters
        value: ["local.abbottland.io"]
      - op: replace
        path: /spec/values/policy
        value: upsert-only
