apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pi-hole instance: upsert-only + registry noop so it never deletes gen2's records (same domain);
# flip to sync after the gen2 grafana/prometheus routes are gone (Phase 9 step 6).
# Cloudflare instance: live since the Phase 8 ownership swap (gen2's instance is scaled to 0), `sync` (base default) since Phase 9 step 4;
# the txt registry means it only deletes records it owns.
# Owner id prod-gen2 = gen2's, so gen3 takes over the existing Cloudflare records.
resources:
  - ../../base/external-dns

patches:
  - target:
      kind: HelmRelease
      name: external-dns
    patch: |-
      - op: add
        path: /spec/values/txtOwnerId
        # Inherits gen2's ownership of the existing Cloudflare records (txt registry owner).
        value: prod-gen2
      - op: add
        path: /spec/values/domainFilters
        value: ["abbottland.io"]
  - target:
      kind: HelmRelease
      name: external-dns-pihole
    patch: |-
      - op: add
        path: /spec/values/txtOwnerId
        value: prod-gen3-pihole
      - op: add
        path: /spec/values/domainFilters
        value: ["local.abbottland.io"]
      - op: replace
        path: /spec/values/policy
        value: upsert-only
