apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  values:
    defaultBackupStore:
      # Gen3 has its OWN backup store. Never point this at gen2's
      # longhorn-prod (nor longhorn-prod.pre-gen3-copy). Volumes restored from it
      # keep backupTargetName=live-restore until patched to `default`.
      backupTarget: nfs://192.168.4.124:/volume1/Backups/longhorn-prod-gen3
      backupTargetCredentialSecret: cifs-secret
    defaultSettings:
      # Controllers are schedulable but have no /mnt/ssd; only nodes labeled
      # node.longhorn.io/create-default-disk=true (the 3 workers) get a disk.
      createDefaultDiskLabeledNodes: true
      defaultReplicaCount: 2
      # Volumes are thin-provisioned and mostly empty; the default 100% left no
      # room to reschedule replicas (e.g. when a worker is down).
      # NOTE: Longhorn only reads defaultSettings at install, so the live
      # setting was also patched (settings.longhorn.io).
      storageOverProvisioningPercentage: 150
    longhornManager:
      # Run the manager on the tainted controllers (controller-2/3) too. Longhorn
      # creates a Node object per k8s node and marks it Ready=False
      # (ManagerPodMissing) when no manager pod runs there, which shows as "down"
      # in the UI. They have no disk (no create-default-disk label), so no
      # replicas land there. Only the manager DaemonSet is changed: the
      # taint-toleration setting (instance-manager/CSI) can't be changed while
      # volumes are attached.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    persistence:
      defaultClassReplicaCount: 2
