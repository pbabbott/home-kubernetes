apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# op-credentials.yaml is sealed for gen3's controller key (content copied from gen2's secret).
resources:
  - ../../base/onepassword
  - op-credentials.yaml

patches:
  # No Gateway on gen3 until istio (Phase 4).
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: op-connect
        namespace: op-connect
      $patch: delete
