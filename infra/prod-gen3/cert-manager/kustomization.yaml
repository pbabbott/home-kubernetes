apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/cert-manager

patches:
  # Staging issuer only: gen2 owns the prod certs (duplicate-certificate rate limit).
  - patch: |-
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
      $patch: delete
  # cloudflare-ddns is not ported yet (Phase 8).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflare-ddns
        namespace: cert-manager
      $patch: delete
