apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gen3 monitoring: fresh Prometheus (no restore). prometheus-ui/grafana-ui carry the real names
# (labelled, gen3 external-dns owns the records).
# Control-plane scrapes (etcd/scheduler/controller-manager/proxy) stay disabled in base, which also
# drops their rule groups; scraping k3s's single-process control plane needs k3s playbook changes.
resources:
  - ../../../base/observability/kube-prometheus-stack
  - grafana-admin-onepassword.yaml
  - node-exporter-physical-scrapeconfig.yaml
  - windows-exporter-physical-scrapeconfig.yaml

patches:
  - path: kube-prometheus-stack-helm-release-patch.yaml
  # Admin credentials come from the 1Password item grafana-gen3-admin (fields username/password).
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: remove
        path: /spec/values/grafana/adminPassword
  - target:
      kind: HTTPRoute
      name: prometheus-ui
      namespace: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: prometheus.local.abbottland.io
      # record target comes from the Gateway annotation (192.168.6.29).
  - target:
      kind: HTTPRoute
      name: grafana-ui
      namespace: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: grafana.local.abbottland.io
