apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/longhorn
  - longhorn-recurring-job.yaml

patches:
  # UI route deleted: needs a Pi-hole record (hostname collides with gen2); comes back in Phase 5 (DNS).
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: longhorn-ui
        namespace: longhorn-system
      $patch: delete
  - path: longhorn-helmrelease-patch.yaml
