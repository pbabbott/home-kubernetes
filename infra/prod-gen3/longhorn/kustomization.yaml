apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/longhorn

patches:
  # No istio on gen3 yet (Phase 4); the UI route comes back with it.
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: longhorn-ui
        namespace: longhorn-system
      $patch: delete
  - path: longhorn-helmrelease-patch.yaml
