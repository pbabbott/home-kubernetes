apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gen3 istio (ambient, 1.30.*). Differences from base/gen2:
# - istio-cni keeps the chart default paths (/etc/cni/net.d, /opt/cni/bin): gen3 runs Calico,
#   which writes there; the k3s agent dirs (flannel layout) are empty, so k3s paths break chaining
# - Both gateways use letsencrypt-prod (public gateway switched in Phase 8, before the eero flip)
# - ztunnel: IPV6_ENABLED=false (gen3 nodes have no IPv6 in the kernel; ztunnel crashes with
#   "Address family not supported" binding its readiness server)
# - apex listener on the public Gateway (same as gen2)
# internal-apps-ip-allowlist (base) checked for gen3: 192.168.0.0/16 covers HAProxy .29 and LAN,
# 10.244.0.0/16 = pod CIDR, 10.0.0.0/8 covers service CIDR 10.43.0.0/16. No change needed.
resources:
  - ../../base/istio

patches:
  - target:
      kind: HelmRelease
      name: ztunnel
    patch: |-
      - op: add
        path: /spec/values/env
        value:
          IPV6_ENABLED: "false"
  - target:
      kind: Gateway
      name: istio-ingress
      namespace: istio-system
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
  - target:
      kind: Gateway
      name: istio-ingress-public
      namespace: istio-system
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: add
        path: /spec/listeners/-
        value:
          name: https-public-apex
          port: 443
          protocol: HTTPS
          hostname: "abbottland.io"
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: apex-public-tls
          allowedRoutes:
            namespaces:
              from: All
