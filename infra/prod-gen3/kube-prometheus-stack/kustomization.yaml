apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gen3 monitoring: fresh Prometheus (no restore). Prometheus has a Pi-hole record (Phase 5); Grafana has none,
# test it with curl --resolve <host>:443:192.168.6.29.
# Control-plane scrapes (etcd/scheduler/controller-manager/proxy) stay disabled in base, which also
# drops their rule groups; scraping k3s's single-process control plane needs k3s playbook changes.
resources:
  - ../../base/kube-prometheus-stack
  - grafana-admin-onepassword.yaml
  - node-exporter-physical-scrapeconfig.yaml
  - windows-exporter-physical-scrapeconfig.yaml

patches:
  - path: kube-prometheus-stack-helm-release-patch.yaml
  # Admin credentials come from the 1Password item grafana-gen3-admin (fields username/password).
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: remove
        path: /spec/values/grafana/adminPassword
  - target:
      kind: HTTPRoute
      name: prometheus-ui
      namespace: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: prometheus-gen3.local.abbottland.io
      # pihole-dns-enabled label kept: Phase 5 record prometheus-gen3.local -> 192.168.6.29 (Gateway annotation).
      - op: remove
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
  - target:
      kind: HTTPRoute
      name: grafana-ui
      namespace: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: grafana-gen3.local.abbottland.io
      - op: remove
        path: /metadata/labels/pihole-dns-enabled
      - op: remove
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
