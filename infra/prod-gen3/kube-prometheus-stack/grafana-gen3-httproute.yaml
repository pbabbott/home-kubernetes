# Test hostname kept until Phase 9. Unlabelled and recordless: test with curl --resolve.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-gen3-ui
  namespace: kube-prometheus-stack
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-system
      sectionName: https
  hostnames:
    - grafana-gen3.local.abbottland.io
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
