---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-prometheus-stack
  releaseName: kube-prometheus-stack
  dependsOn:
    - name: kube-prometheus-stack-crds
      namespace: flux-system
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '70.*'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    crds:
      enabled: false
    # Alertmanager is skipped on purpose (decision 2026-11-11, issue #53): no alert routing wanted yet.
    alertmanager:
      enabled: false
    grafana:
      enabled: true
      adminPassword: admin
      grafana.ini:
        date_formats:
          default_timezone: America/Chicago
      readinessProbe:
        timeoutSeconds: 10
      livenessProbe:
        timeoutSeconds: 10
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
    defaultRules:
      enabled: true
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      livenessProbe:
        initialDelaySeconds: 120
      readinessProbe:
        initialDelaySeconds: 120
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: false
    coreDns:
      enabled: true
    kubeDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus-node-exporter:
      livenessProbe:
        timeoutSeconds: 5
      readinessProbe:
        timeoutSeconds: 5
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        # Sized from measurement (2026-11-11): ~145k series = ~490Mi (~3.3 KB/series), limit ~3x for head growth, compaction
        # and queries. It OOM-looped at 1500Mi when it held ~950k series (k3s duplicate scrapes, since removed): if the
        # series count grows again, check prometheus_tsdb_head_series before raising this.
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 1536Mi
        storageSpec:
          volumeClaimTemplate:
            metadata:
              labels:
                recurring-job-group.longhorn.io/default: disabled
            spec:
              storageClassName: longhorn-single # regenerable metrics, 1 replica (#59)
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi # ~165k series; 20Gi was sized for the ~950k-series ingest
        retention: 1d
        retentionSize: 4GB # stay under the 5Gi PVC
