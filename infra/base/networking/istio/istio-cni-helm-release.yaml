apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: istio-system
  dependsOn:
    - name: istiod
      namespace: flux-system
  chart:
    spec:
      chart: cni
      version: "1.30.*"
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    profile: ambient
    # Chart default is 100Mi with no limit; the agent runs at 37-82Mi (2026-11-11), so it showed ~80% of its request.
    # Raise only the request (cosmetic + honest scheduling). Do not add a limit: an OOM-killed CNI agent breaks pod networking.
    resources:
      requests:
        memory: 128Mi
