apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 group 2 (home-hud move). Flipped from gen2: base routes carry pihole-dns-enabled, so gen3
# external-dns owns the home-hud *.local records -> .29 (target comes from the Gateway annotation).
# homelab-api keeps the base PROMETHEUS_URL (gen3 prometheus.local); gen2's prometheus-gen2 patch is dropped.
# Media/backup NFS PVs come from the base (no data move).
resources:
  - ../../base/home-hud

patches:
  - target:
      kind: Deployment
      name: home-hud
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HOMELAB_API_PUBLIC_URL
          value: https://homelab-api.local.abbottland.io
