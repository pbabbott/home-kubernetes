apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 group 2 (home-hud move). STAGED: HTTPRoutes keep their real hostnames but the
# pihole-dns-enabled label and the .28 target annotation are removed, so gen3 external-dns creates
# no records. The flip merge deletes the two strip patches below (and gen2 deletes its routes).
# homelab-api keeps the base PROMETHEUS_URL (gen3 prometheus.local); gen2's prometheus-gen2 patch is dropped.
# Media/backup NFS PVs come from the base (no data move).
resources:
  - ../../base/home-hud

patches:
  - target:
      kind: HTTPRoute
      labelSelector: pihole-dns-enabled=true
    patch: |-
      - op: remove
        path: /metadata/labels/pihole-dns-enabled
  - target:
      kind: HTTPRoute
      annotationSelector: external-dns.alpha.kubernetes.io/target
    patch: |-
      - op: remove
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
  - target:
      kind: Deployment
      name: home-hud
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HOMELAB_API_PUBLIC_URL
          value: https://homelab-api.local.abbottland.io
