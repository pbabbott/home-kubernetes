apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 group 4 (ARC move). FLIPPED: the turborepo-cache route carries pihole-dns-enabled, so gen3
# external-dns owns turborepo-cache.local -> .29 (target comes from the Gateway annotation).
# Runner scale sets are renamed prod-gen3-* (the name is the `runs-on` label), so they register next to the
# gen2 ones without colliding. Caches (turbo, actions-cache, pnpm store) start EMPTY. Nothing here needs
# regcred or github-pat: ARC uses arc-gh-secret + turbo-cache-token (1Password), images are public,
# and the dind mirror is Harbor's anonymous proxy-dockerhub project.
resources:
  - ../../base/arc
  - arc-gh-secret.yaml
  - arc-controller-servicemonitor.yaml
  - turbo-cache-token-onepassworditem.yaml
  - turborepo-cache-httproute.yaml

patches:
  # runner scale sets: gen3 names. Placement is a HARD rule to workers 1/2 (16 GB each): worker-3 is a
  # 6 GB VM on chimaera (shared host, IO-bound) and a preferred-only rule let three dind pods land there
  # and exhaust it (2026-11-09 CI run). maxRunners and requests are sized for 2 x ~11 GB free.
  - target:
      kind: HelmRelease
      name: arc-runner-amd64
    patch: |-
      - op: replace
        path: /spec/releaseName
        value: prod-gen3-amd64-runner
      - op: replace
        path: /spec/values/runnerScaleSetName
        value: prod-gen3-amd64-runner
      - op: replace
        path: /spec/values/template/spec/topologySpreadConstraints/0/labelSelector/matchLabels/app.kubernetes.io~1instance
        value: prod-gen3-amd64-runner
      - op: replace
        path: /spec/values/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution/0/podAffinityTerm/labelSelector/matchLabels/app.kubernetes.io~1instance
        value: prod-gen3-dind-runner
      - op: add
        path: /spec/values/template/spec/affinity/nodeAffinity
        value:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
      - op: replace
        path: /spec/values/maxRunners
        value: 6
  - target:
      kind: HelmRelease
      name: arc-runner-dind-amd64
    patch: |-
      - op: replace
        path: /spec/releaseName
        value: prod-gen3-dind-runner
      - op: replace
        path: /spec/values/runnerScaleSetName
        value: prod-gen3-dind-runner
      - op: replace
        path: /spec/values/template/spec/topologySpreadConstraints/0/labelSelector/matchLabels/app.kubernetes.io~1instance
        value: prod-gen3-dind-runner
      - op: replace
        path: /spec/values/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution/0/podAffinityTerm/labelSelector/matchLabels/app.kubernetes.io~1instance
        value: prod-gen3-amd64-runner
      - op: add
        path: /spec/values/template/spec/affinity/nodeAffinity
        value:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
      - op: replace
        path: /spec/values/maxRunners
        value: 6
      - op: replace
        path: /spec/values/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/values/template/spec/initContainers/1/resources/requests/memory
        value: 1536Mi
  # controller placement
  - target:
      kind: HelmRelease
      name: arc-controller
    patch: |-
      - op: add
        path: /spec/values/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
  # cache servers placement (extra post-renderer patch on the Deployment)
  - target:
      kind: HelmRelease
      name: actions-cache-server
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: actions-cache-server
          patch: |
            - op: add
              path: /spec/template/spec/affinity
              value:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: node-role.kubernetes.io/control-plane
                            operator: DoesNotExist
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      preference:
                        matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: In
                            values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
  - target:
      kind: HelmRelease
      name: turborepo-remote-cache
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: turborepo-remote-cache
          patch: |
            - op: add
              path: /spec/template/spec/affinity
              value:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: node-role.kubernetes.io/control-plane
                            operator: DoesNotExist
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      preference:
                        matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: In
                            values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
