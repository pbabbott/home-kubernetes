apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashy
  namespace: flux-system
spec:
  targetNamespace: dashy
  chart:
    spec:
      chart: ./applications/base/dashy
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 30m
  # STAGING ONLY (Phase 6b): the chart hardcodes the pihole-dns-enabled label and the .28 target
  # annotation. Remove both so gen3 external-dns creates no record. The flip commit deletes this block.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: dashy
            patch: |-
              - op: remove
                path: /metadata/labels/pihole-dns-enabled
              - op: remove
                path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
  values:
    hostname: dashy.local.abbottland.io
    pageTitle: "Homelab"
    urls:
      pihole: https://pihole.local.abbottland.io/admin/
      haproxy: https://haproxy.local.abbottland.io
      proxmox: https://proxmox.local.abbottland.io
      asustor: https://asustor.local.abbottland.io
      flux: https://flux.local.abbottland.io
      longhorn: https://longhorn.local.abbottland.io
      prometheus: https://prometheus.local.abbottland.io
      grafana: https://grafana.local.abbottland.io
      harbor: https://harbor.local.abbottland.io
      podinfoLocal: https://podinfo.local.abbottland.io/
      podinfoPublic: http://podinfo.abbottland.io/
    sections:
      mediaEnabled: true
      appsEnabled: true
