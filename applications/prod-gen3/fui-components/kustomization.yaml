apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 public apps: staged on gen3 next to gen2, public routes carry external-dns-enabled since Phase 8.
resources:
  - ../../base/fui-components

patches:
  # Hard-pin to the 16 GB workers (worker-3 is a 6 GB VM, controller-3 ~3 GB).
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
