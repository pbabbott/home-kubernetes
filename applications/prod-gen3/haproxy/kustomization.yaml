apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Flipped from gen2 in Phase 6a: route carries pihole-dns-enabled, gen3 external-dns owns haproxy.local.
# EndpointSlice and scrape target (base) point at the gen3 HAProxy 192.168.6.29:8404 (.28 retired, Phase 9).
resources:
  - ../../base/haproxy

patches:
  - target:
      kind: HTTPRoute
      name: haproxy
      namespace: haproxy
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: haproxy.local.abbottland.io
  - target:
      kind: HTTPRoute
      name: haproxy-http-to-https
      namespace: haproxy
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: haproxy.local.abbottland.io
