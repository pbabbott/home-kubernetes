apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 6a staging: same hostname as gen2 but NO pihole-dns-enabled label, so gen3 external-dns writes no record.
# Flip = delete the label/annotation removal patch below AND remove ./haproxy from applications/prod-gen2 (one merge).
resources:
  - ../../base/haproxy

patches:
  - target:
      kind: HTTPRoute
      name: haproxy
      namespace: haproxy
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: haproxy.local.abbottland.io
      - op: remove
        path: /metadata/labels/pihole-dns-enabled
      - op: remove
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
  - target:
      kind: HTTPRoute
      name: haproxy-http-to-https
      namespace: haproxy
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: haproxy.local.abbottland.io
