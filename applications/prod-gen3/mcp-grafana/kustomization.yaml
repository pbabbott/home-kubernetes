apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Flipped from gen2 in Phase 6b: base route keeps pihole-dns-enabled, so gen3 external-dns owns
# mcp-grafana.local -> .29 (target comes from the Gateway annotation).
# Gen3 has its own Homelab item (token from gen3 Grafana).
resources:
  - ../../base/mcp-grafana

patches:
  - target:
      kind: OnePasswordItem
      name: mcp-grafana-secrets
      namespace: mcp-grafana
    patch: |-
      - op: replace
        path: /spec/itemPath
        value: vaults/Homelab/items/mcp-grafana-gen3
