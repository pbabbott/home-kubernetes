apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 group 3 (harbor move). STAGED: the harbor HTTPRoute keeps its real hostname but the
# pihole-dns-enabled label and the .28 target annotation are removed, so gen3 external-dns creates
# no record. The flip merge deletes the two strip patches below (and gen2 deletes its route).
# Data: registry dir rsynced on the NAS into prod-gen3/harbor-harbor-registry-nas; trivy + jobservice
# PVCs pre-created by longhorn-restore.sh; DB/Redis on the NAS are shared (one cluster at a time).
# Soft nodeAffinity keeps Harbor off the small controller-3/worker-3 nodes.
resources:
  - ../../base/harbor

patches:
  - target:
      kind: HelmRelease
      name: harbor
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/values/externalURL
        value: https://harbor.local.abbottland.io
      - op: replace
        path: /spec/values/database/external/coreDatabase
        value: harbor_prod
      - op: replace
        path: /spec/values/redis/external/coreDatabaseIndex
        value: "3"
      - op: replace
        path: /spec/values/redis/external/jobserviceDatabaseIndex
        value: "4"
      - op: replace
        path: /spec/values/redis/external/registryDatabaseIndex
        value: "11"
      - op: replace
        path: /spec/values/redis/external/trivyAdapterDatabaseIndex
        value: "12"
      - op: replace
        path: /spec/values/redis/external/harborDatabaseIndex
        value: "5"
      - op: replace
        path: /spec/values/redis/external/cacheLayerDatabaseIndex
        value: "6"
  - target:
      kind: HTTPRoute
      name: harbor
      namespace: harbor
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: harbor.local.abbottland.io
  - target:
      kind: HelmRelease
      name: harbor
      namespace: flux-system
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: harbor
        namespace: flux-system
      spec:
        values:
          # gen3 nodes have no IPv6 (nginx/portal fail on listen [::]:8080)
          ipFamily:
            ipv6:
              enabled: false
          portal:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
          core:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
          jobservice:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
          registry:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
          trivy:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
          exporter:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
          nginx:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
  - target:
      kind: HTTPRoute
      labelSelector: pihole-dns-enabled=true
    patch: |-
      - op: remove
        path: /metadata/labels/pihole-dns-enabled
  - target:
      kind: HTTPRoute
      annotationSelector: external-dns.alpha.kubernetes.io/target
    patch: |-
      - op: remove
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
