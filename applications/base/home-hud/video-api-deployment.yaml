apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api
  namespace: home-hud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-api
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: video-api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: video-api
          image: harbor.local.abbottland.io/library/video-api:20260730-58-1484f3c # {"$imagepolicy": "flux-system:video-api"}
          imagePullPolicy: Always
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: MEDIA_ROOT
              value: /media
            - name: POSTGRES_HOST
              value: nas.local.abbottland.io
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: video_api
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
