apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-hud
  namespace: home-hud
spec:
  podSelector:
    matchLabels:
      app: home-hud
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-hud
          podSelector:
            matchLabels:
              app: video-api
      ports:
        - port: 4002
          protocol: TCP
