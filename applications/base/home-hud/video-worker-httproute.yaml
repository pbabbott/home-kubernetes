apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: video-worker
  namespace: home-hud
  labels:
    pihole-dns-enabled: "true"
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-system
      sectionName: https
  hostnames:
    - "video-worker.local.abbottland.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: video-worker
          port: 4003
