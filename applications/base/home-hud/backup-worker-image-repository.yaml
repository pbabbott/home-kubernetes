apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: backup-worker
  namespace: flux-system
spec:
  image: harbor.local.abbottland.io/library/backup-worker
  interval: 5m
  secretRef:
    name: regcred-flux
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: backup-worker
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: backup-worker
  filterTags:
    pattern: '^\d{8}-\d+-[a-f0-9]{7}$'
  policy:
    alphabetical:
      order: asc
