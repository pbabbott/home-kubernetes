apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-hud-backup-pv
spec:
  capacity:
    storage: 10Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - hard
  nfs:
    server: 192.168.4.124
    path: "/volume1/Dump"
  claimRef:
    namespace: home-hud
    name: backup-pvc
