apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-worker
  namespace: home-hud
spec:
  podSelector:
    matchLabels:
      app: video-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 4003
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
      ports:
        - port: 4003
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.4.124/32
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.5.142/32
      ports:
        - port: 1234
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
