apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-worker
  namespace: home-hud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-worker
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: video-worker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: video-worker
          image: harbor.local.abbottland.io/library/video-worker:20260727-52-f9869cb # {"$imagepolicy": "flux-system:video-worker"}
          imagePullPolicy: Always
          ports:
            - containerPort: 4003
          env:
            - name: PORT
              value: "4003"
            - name: MEDIA_ROOT
              value: /media
            - name: POSTGRES_HOST
              value: nas.local.abbottland.io
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: video_api
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POLL_INTERVAL_MS
              value: "5000"
            - name: FFMPEG_PATH
              value: ffmpeg
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
