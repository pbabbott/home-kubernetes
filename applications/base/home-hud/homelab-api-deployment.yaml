apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-api
  namespace: home-hud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-api
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: homelab-api
    spec:
      serviceAccountName: homelab-api
      imagePullSecrets:
        - name: regcred
      containers:
        - name: homelab-api
          image: harbor.local.abbottland.io/library/homelab-api:20261018-74-c9599c4 # {"$imagepolicy": "flux-system:homelab-api"}
          imagePullPolicy: Always
          ports:
            - containerPort: 4003
          env:
            - name: PORT
              value: "4003"
            - name: PROMETHEUS_URL
              value: https://prometheus.local.abbottland.io
            - name: PROMETHEUS_QUERY_WINDOW_SECONDS
              value: "300"
            - name: POSTGRES_HOST
              value: nas.local.abbottland.io
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: homelab_api
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
