apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mcp-arr
  name: mcp-arr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-arr
  template:
    metadata:
      labels:
        app: mcp-arr
    spec:
      containers:
        - name: mcp-arr
          image: ghcr.io/aplaceforallmystuff/mcp-arr:1.7.3
          env:
            - name: MCP_TRANSPORT
              value: http
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: RADARR_URL
              value: http://radarr:7878
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-arr-secrets
                  key: RADARR_API_KEY
            - name: SONARR_URL
              value: http://sonarr:8989
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-arr-secrets
                  key: SONARR_API_KEY
            - name: PROWLARR_URL
              value: http://prowlarr:9696
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-arr-secrets
                  key: PROWLARR_API_KEY
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            tcpSocket:
              port: 3000
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
