apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-qbittorrent
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: mcp-qbittorrent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw
          podSelector:
            matchLabels:
              app: openclaw
      ports:
        - port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: qbittorrent-vpn
      ports:
        - port: 8080
          protocol: TCP
