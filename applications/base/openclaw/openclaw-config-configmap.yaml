apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "publicOrigin": "https://openclaw.local.abbottland.io"
      },
      "models": {
        "providers": {
          "lmstudio": {
            "baseUrl": "http://192.168.5.142:1234/v1",
            "apiKey": "lmstudio",
            "api": "openai-completions",
            "models": [
              {
                "id": "google/gemma-4-e4b",
                "name": "Gemma 4 E4B",
                "input": ["text", "image"],
                "contextWindow": 32768,
                "maxTokens": 8192
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "lmstudio/google/gemma-4-e4b"
          }
        }
      }
    }
  AGENTS.md: |
    # Agents

    Add agent instructions and configuration here.
