  radarr-SKILL.md: |
    ---
    name: radarr
    description: "Search, list, and add movies in the homelab Radarr instance, and check its download queue, via the Radarr v3 REST API with curl."
    metadata:
      {
        "openclaw":
          {
            "emoji": "🎬",
            "requires": { "bins": ["curl"], "env": ["RADARR_API_KEY", "RADARR_URL"] },
            "primaryEnv": "RADARR_API_KEY",
          },
      }
    ---

    # Radarr

    Radarr manages the movie library. Reach it with `curl` using the
    `RADARR_URL` and `RADARR_API_KEY` environment variables. Always send the key
    as a header, never put it in a URL, and never print it.

    ```bash
    api() { curl -sS -H "X-Api-Key: $RADARR_API_KEY" -H "Content-Type: application/json" "$@"; }
    ```

    ## Read (safe, no confirmation needed)

    - Library: `api "$RADARR_URL/api/v3/movie"` (large; filter with `jq` or node)
    - Look up a title: `api "$RADARR_URL/api/v3/movie/lookup?term=The%20Matrix"`
    - Download queue: `api "$RADARR_URL/api/v3/queue"`
    - Quality profiles: `api "$RADARR_URL/api/v3/qualityprofile"`
    - Root folders: `api "$RADARR_URL/api/v3/rootfolder"`
    - Health: `api "$RADARR_URL/api/v3/health"`

    ## Add a movie (confirm with the user first)

    1. Look the title up, show the user the matches (title, year, tmdbId), and
       get explicit confirmation of which one.
    2. Fetch `qualityprofile` and `rootfolder`; ask which to use if unclear.
    3. POST the lookup result with the chosen `qualityProfileId`,
       `rootFolderPath`, `monitored: true`, and
       `addOptions: { "searchForMovie": true }` to `$RADARR_URL/api/v3/movie`.

    ## Rules

    - Do not delete movies or files, edit settings, or change indexers or
      download clients.
    - Radarr is reachable only inside the cluster at `$RADARR_URL`.
    - If a call returns 401, the API key is wrong or missing; report it rather
      than retrying.
