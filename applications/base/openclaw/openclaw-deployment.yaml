apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-perms
          image: ghcr.io/openclaw/openclaw:2026.9.9-slim
          command: ["/bin/sh", "-c"]
          args:
            - chmod 1777 /tmp && chown 1000:1000 /home/node/.openclaw /tmp /home/node/.cache
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache
        - name: init-config
          image: ghcr.io/openclaw/openclaw:2026.9.9-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              [ -f /home/node/.openclaw/openclaw.json ] || cp /config/openclaw.json /home/node/.openclaw/
              [ -f /home/node/.openclaw/AGENTS.md ] || cp /config/AGENTS.md /home/node/.openclaw/
              mkdir -p /home/node/.openclaw/claude-config
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
      containers:
        - name: gateway
          image: ghcr.io/openclaw/openclaw:2026.9.9-slim
          ports:
            - containerPort: 18789
              name: http
          envFrom:
            - secretRef:
                name: openclaw-secrets
          env:
            - name: npm_config_cache
              value: /home/node/.cache/npm
            - name: CLAUDE_CONFIG_DIR
              value: /home/node/.openclaw/claude-config
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /startupz
              port: 18789
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 18789
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18789
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-pvc
        - name: config
          configMap:
            name: openclaw-config
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
