apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 group 2: stopped on gen2 so the app only runs in ONE cluster (shared NAS Postgres/NFS).
# Routes deleted (flipped to gen3). Do NOT remove from this overlay until the gen3 soak is over
# (gen2 PVs are reclaim `Delete`).

resources:
  - ../../base/openclaw

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: HTTPRoute
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: ignored
