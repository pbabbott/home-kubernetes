apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/umami

patches:
  # analytics-admin.local moved to gen3 (Phase 7 public apps); gen2 umami keeps serving analytics.abbottland.io until Phase 8.
  - target:
      kind: HTTPRoute
      name: umami-admin
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: umami-admin
        namespace: umami
  # Phase 8: public traffic is served by gen3 (eero forward -> .29). Stopped, prune follows in a later merge. Revert to roll back.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
