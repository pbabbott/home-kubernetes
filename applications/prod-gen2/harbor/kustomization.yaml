apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/harbor

patches:
  - target:
      kind: HelmRelease
      name: harbor
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/values/externalURL
        value: https://harbor.local.abbottland.io
      - op: replace
        path: /spec/values/database/external/coreDatabase
        value: harbor_prod
      - op: replace
        path: /spec/values/redis/external/coreDatabaseIndex
        value: "3"
      - op: replace
        path: /spec/values/redis/external/jobserviceDatabaseIndex
        value: "4"
      - op: replace
        path: /spec/values/redis/external/registryDatabaseIndex
        value: "11"
      - op: replace
        path: /spec/values/redis/external/trivyAdapterDatabaseIndex
        value: "12"
      - op: replace
        path: /spec/values/redis/external/harborDatabaseIndex
        value: "5"
      - op: replace
        path: /spec/values/redis/external/cacheLayerDatabaseIndex
        value: "6"
  - target:
      kind: HTTPRoute
      name: harbor
      namespace: harbor
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: harbor.local.abbottland.io
  # Phase 7 group 3 data move: Harbor stopped on gen2 (replicas 0, NOT a prune: gen2 PVs are reclaim Delete).
  - target:
      kind: HelmRelease
      name: harbor
      namespace: flux-system
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: harbor
        namespace: flux-system
      spec:
        values:
          portal:
            replicas: 0
          core:
            replicas: 0
          jobservice:
            replicas: 0
          registry:
            replicas: 0
          trivy:
            replicas: 0
          exporter:
            replicas: 0
          nginx:
            replicas: 0
  # Phase 7 group 3 flip: route now served by gen3.
  - target:
      kind: HTTPRoute
      name: harbor
      namespace: harbor
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: harbor
        namespace: harbor
