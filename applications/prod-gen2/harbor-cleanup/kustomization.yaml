apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/harbor-cleanup

patches:
  # Phase 7 group 3 data move: stopped on gen2.
  - target:
      kind: Deployment
      name: harbor-cleanup
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # Phase 7 group 3 flip: routes now served by gen3.
  - target:
      kind: HTTPRoute
      name: harbor-cleanup
      namespace: harbor-cleanup
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: harbor-cleanup
        namespace: harbor-cleanup
  - target:
      kind: HTTPRoute
      name: harbor-cleanup-http-to-https
      namespace: harbor-cleanup
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: harbor-cleanup-http-to-https
        namespace: harbor-cleanup
