apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/home-hud

patches:
  - target:
      kind: Deployment
      name: home-hud
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HOMELAB_API_PUBLIC_URL
          value: https://homelab-api.local.abbottland.io
  # Phase 6b: prometheus.local moved to gen3 (empty history, staging cert). Keep gen2's homelab-api on gen2's Prometheus.
  - target:
      kind: Deployment
      name: homelab-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://prometheus-gen2.local.abbottland.io
