apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 group 2: stopped on gen2 so the app only runs in ONE cluster (shared NAS Postgres/NFS).
# Do NOT remove from this overlay until the gen3 soak is over (gen2 PVs are reclaim `Delete`).

resources:
  - ../../base/home-hud

patches:
  - target:
      kind: Deployment
      name: home-hud
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HOMELAB_API_PUBLIC_URL
          value: https://homelab-api.local.abbottland.io
  # Phase 6b: prometheus.local moved to gen3 (empty history, staging cert). Keep gen2's homelab-api on gen2's Prometheus.
  - target:
      kind: Deployment
      name: homelab-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://prometheus-gen2.local.abbottland.io
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
