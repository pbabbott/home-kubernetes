# Run `pre-commit install` once per clone.
repos:
- repo: local
  hooks:
    - id: scripts-manifest
      name: scripts manifest (scripts/CLAUDE.md)
      entry: bash ./scripts/check-manifest.sh
      language: system
      files: ^scripts/
      pass_filenames: false
    - id: public-netpol
      name: public apps have a locked-down NetworkPolicy
      entry: bash ./scripts/check-public-netpol.sh
      language: system
      files: ^(apps|scripts)/
      pass_filenames: false
