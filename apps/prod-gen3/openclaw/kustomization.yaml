apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 group 2 (openclaw move). Flipped from gen2: base routes carry pihole-dns-enabled, so gen3
# external-dns owns the openclaw *.local records -> .29 (target comes from the Gateway annotation).
# openclaw-pvc is pre-created from the gen2 final Longhorn backup (scripts/longhorn-restore.sh).
resources:
  - ../../base/openclaw
