# Direct A records to the Proxmox hosts (not proxied through Istio, so the UIs stay reachable when the cluster is down).
# Pi-hole external-dns runs policy=sync + registry=noop, so records only persist when they come from a labelled DNSEndpoint.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: pve-hogwarts
  namespace: proxmox
  labels:
    pihole-dns-enabled: "true"
spec:
  endpoints:
    - dnsName: pve-hogwarts.local.abbottland.io
      recordType: A
      targets:
        - 192.168.4.196
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: pve-chimaera
  namespace: proxmox
  labels:
    pihole-dns-enabled: "true"
spec:
  endpoints:
    - dnsName: pve-chimaera.local.abbottland.io
      recordType: A
      targets:
        - 192.168.4.192
