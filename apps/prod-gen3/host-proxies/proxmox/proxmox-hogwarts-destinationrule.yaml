# Proxmox serves HTTPS on 8006 with a self-signed cert. Originate TLS from the ingress gateway to the backend.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: proxmox-hogwarts
  namespace: proxmox
spec:
  host: proxmox-hogwarts.proxmox.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
