apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Flipped from gen2 in Phase 6a: base route keeps pihole-dns-enabled, so gen3 external-dns owns proxmox.local -> .29
# (target comes from the Gateway annotation).
resources:
  - ../../../base/host-proxies/proxmox

patches:
  - target:
      kind: HTTPRoute
      name: proxmox
      namespace: proxmox
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: proxmox.local.abbottland.io
  - target:
      kind: HTTPRoute
      name: proxmox-http-to-https
      namespace: proxmox
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: proxmox.local.abbottland.io
