apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 group 3 (harbor-cleanup move). FLIPPED: gen3 external-dns owns harbor-cleanup.local -> .29.
# Stateless (Harbor API + GitHub PAT). Its image lives in Harbor: it stays ImagePullBackOff until
# harbor.local resolves to gen3 (flip), then starts by itself.
resources:
  - ../../../base/ci-registry/harbor-cleanup

patches:
  - target:
      kind: Deployment
      name: harbor-cleanup
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [tf-prod-k3s-worker-1, tf-prod-k3s-worker-2]
