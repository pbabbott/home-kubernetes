apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-cleanup-config
  namespace: harbor-cleanup
data:
  HARBOR_HOST: "harbor.local.abbottland.io"
  GITHUB_OWNER: "pbabbott"
  GITHUB_REPO: "home-web-apps"
  CLEANUP_REPOSITORIES: "blog,diagram-maker,fui-components,gluetun-sync,harbor-cleanup,homelab-api,backup-worker,home-hud,video-api,video-worker,blog-base,diagram-maker-base,home-hud-base,homelab-api-base,video-api-base,video-worker-base,backup-worker-base"
  CLEANUP_CRON_EXPRESSION: "0 3 * * *"
  TZ: "America/Chicago"
  # CLEANUP_DRY_RUN is deliberately NOT set. The app parses booleans with Boolean(string), so ANY non-empty value
  # (including "false") turns dry-run ON; leave it unset to delete for real. Add it (any value) to log deletions only.
  # TEMPORARY (#83): dry run for the -base repos. Remove after reviewing the log. node-22-* is deliberately excluded:
  # its semver tags (1.0.0) are referenced by Dockerfiles/skaffold and would be classified legacy and deleted.
  CLEANUP_DRY_RUN: "true"
  PROD_KEEP_COUNT: "5"
  PORT: "4030"
