apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-cleanup-config
  namespace: harbor-cleanup
data:
  HARBOR_HOST: "harbor.local.abbottland.io"
  GITHUB_OWNER: "pbabbott"
  GITHUB_REPO: "home-web-apps"
  CLEANUP_REPOSITORIES: "blog,diagram-maker,fui-components,gluetun-sync,harbor-cleanup"
  CLEANUP_CRON_EXPRESSION: "0 3 * * *"
  TZ: "America/Chicago"
  # Set to "true" to log what would be deleted and delete nothing (reviewed and turned off 2026-11-11, #39)
  CLEANUP_DRY_RUN: "false"
  PROD_KEEP_COUNT: "5"
  PORT: "4030"
