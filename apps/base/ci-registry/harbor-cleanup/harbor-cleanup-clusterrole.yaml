apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-cleanup-pod-reader
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['list']
  # Images referenced by workload templates (scaled to zero, CronJobs between runs) are protected too
  - apiGroups: ['apps']
    resources: ['deployments', 'statefulsets', 'daemonsets']
    verbs: ['list']
  - apiGroups: ['batch']
    resources: ['jobs', 'cronjobs']
    verbs: ['list']
