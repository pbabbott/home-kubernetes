apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagram-maker
  namespace: diagram-maker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diagram-maker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: diagram-maker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: diagram-maker
          image: harbor.local.abbottland.io/library/diagram-maker:20261111-00095-00253-1540400 # {"$imagepolicy": "flux-system:diagram-maker"}
          env:
            - name: IMAGE_TAG
              value: 20261111-00095-00253-1540400 # {"$imagepolicy": "flux-system:diagram-maker:tag"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
