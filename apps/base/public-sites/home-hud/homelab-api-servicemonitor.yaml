apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: homelab-api
  namespace: home-hud
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: homelab-api
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
  namespaceSelector:
    matchNames:
      - home-hud
