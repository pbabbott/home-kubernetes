apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-arr
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: mcp-arr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw
          podSelector:
            matchLabels:
              app: openclaw
      ports:
        - port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: radarr
      ports:
        - port: 7878
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: sonarr
      ports:
        - port: 8989
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: prowlarr
      ports:
        - port: 9696
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
